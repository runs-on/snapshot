name: 'runs-on/snapshot'
description: 'GitHub Action for snapshotting directories on self-hosted runners'
runs:
  using: 'node24'
  main: 'index.js'
  post: 'post.js'
  # required, otherwise it could snapshot directories even if previous steps failed or were interrupted, which could lead to corrupted snapshots
  post-if: "success()"

inputs:
  key:
    description: 'Optional snapshot stream key. Scopes identity by key, normalized mount path, and version; omit to retain the legacy version-only identity.'
    required: false
  restore-keys:
    description: 'Newline-separated exact fallback keys. Requires key; tried on the current branch before the default branch.'
    required: false
  default-branch-fallback:
    description: 'Try the default branch after all current-branch keys miss.'
    default: 'true'
    required: false
  save-if:
    description: 'Policy for save: auto. Either always or git-paths-changed.'
    default: 'always'
    required: false
  force-save:
    description: 'Bypass smart-save skipping; save: false still takes precedence.'
    default: 'false'
    required: false
  git-repository:
    description: 'Repository to compare for smart save; defaults to <path>/workspace.'
    required: false
  git-head:
    description: 'Expected source commit; defaults to GITHUB_SHA and must match the checked-out HEAD to record source metadata.'
    required: false
  git-paths:
    description: 'Newline-separated Git pathspecs required for save-if: git-paths-changed.'
    required: false
  path:
    description: 'Path to the directory to snapshot. Must be an absolute path.'
    required: true
  version:
    description: 'Version of the snapshot to use'
    required: false
    default: 'v1'
  volume_type:
    description: 'Type of volume to use for the snapshot.'
    required: false
    default: 'gp3'
  volume_iops:
    description: 'IOPS to use for the volume.'
    required: false
    default: '3000'
  volume_throughput:
    description: 'Throughput to use for the volume.'
    required: false
    default: '750'
  volume_size:
    description: 'Size (in GiB) of the volume to use for the snapshot.'
    required: false
    default: '40'
  volume_initialization_rate:
    description: 'Initialization rate to use for the volume. Useful for very large volumes. 100 MB/s - 200 MB/s: $0.00240/GB, 201 MB/s - 300 MB/s	$0.00360/GB'
    required: false
    default: '0' # 0 means "disabled"
  wait_for_completion:
    description: 'Wait for snapshot completion before exiting. Note that the first snapshot will always be waited for.'
    required: false
    default: 'false'
  save:
    description: 'Save mode: true, false, or auto. Auto evaluates save-if after the workload. Skipped saves still unmount, detach, and delete the job volume.'
    required: false
    default: 'true'

outputs:
  restored:
    description: 'true when a compatible snapshot was restored; false for a blank volume.'
  restored-from:
    description: 'branch, restore-key, default-branch, default-branch-restore-key, or empty.'
  restored-branch:
    description: 'Branch that supplied the restored snapshot.'
  restored-snapshot-id:
    description: 'Snapshot ID used for restore; empty for a blank volume.'
  volume-id:
    description: 'EBS volume mounted for this job.'
